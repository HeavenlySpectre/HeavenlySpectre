<!-- Catatan singkat tentang Kevin. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title description">
  <title id="title">A little about me</title>
  <desc id="description">Kevin is based in Indonesia, studies at ITS, and enjoys turning messy ideas into working systems.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2b3855" stroke-opacity="0.42" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity="0.28" />
    </filter>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "Courier New", monospace; }
      .ui { font-family: "Trebuchet MS", sans-serif; }
    </style>
  </defs>
  <rect width="900" height="280" rx="14" fill="#10182b" />
  <rect width="900" height="280" rx="14" fill="url(#grid)" />
  <g transform="translate(42 35) rotate(-1 250 100)" filter="url(#shadow)">
    <rect width="520" height="205" rx="5" fill="#f7f1df" />
    <rect x="218" y="-10" width="84" height="24" fill="#ffd166" opacity="0.78" />
    <text class="title" x="28" y="48" fill="#0b1020" font-size="27" font-style="italic">a little about me</text>
    <text class="ui" x="28" y="86" fill="#29324a" font-size="16">Based in Indonesia, studying at ITS.</text>
    <text class="ui" x="28" y="116" fill="#29324a" font-size="16">I like turning messy ideas into systems that work.</text>
    <text class="ui" x="28" y="146" fill="#29324a" font-size="16">Usually somewhere between a model, an API,</text>
    <text class="ui" x="28" y="176" fill="#29324a" font-size="16">a data pipeline, and one more browser tab.</text>
    <path d="M27 185C116 177 196 193 289 184" fill="none" stroke="#ff6b5b" stroke-width="3" stroke-linecap="round" />
  </g>
  <g class="mono" transform="translate(612 49)">
    <text x="0" y="0" fill="#61d4ff" font-size="11">kevin@github:~$</text>
    <text x="0" y="28" fill="#f7f1df" font-size="12">cat interests.txt</text>
    <text x="0" y="65" fill="#8492ad" font-size="11">machine-learning</text>
    <text x="0" y="89" fill="#8492ad" font-size="11">generative-ai / llm</text>
    <text x="0" y="113" fill="#8492ad" font-size="11">data-engineering</text>
    <text x="0" y="137" fill="#8492ad" font-size="11">data-science</text>
    <text x="0" y="177" fill="#b8ff65" font-size="11">done.</text>
    <rect x="40" y="164" width="8" height="16" fill="#b8ff65">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
