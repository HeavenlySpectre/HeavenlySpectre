<!-- Catatan singkat Kevin dalam jaringan minat. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-labelledby="title description">
  <title id="title">A little about me</title>
  <desc id="description">Kevin is based in Indonesia, studies at ITS, and enjoys turning messy ideas into working systems.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#285247" stroke-opacity=".24" /></pattern>
    <style>.title{font-family:Georgia,"Times New Roman",serif}.mono{font-family:"Courier New",monospace}.ui{font-family:"Trebuchet MS",sans-serif}</style>
  </defs>
  <rect width="900" height="250" rx="14" fill="#071b17" /><rect width="900" height="250" rx="14" fill="url(#grid)" />
  <g transform="translate(42 38)">
    <text class="title" fill="#f3ead8" font-size="28" font-style="italic">a little about me</text>
    <text class="ui" y="44" fill="#9ebbb2" font-size="15">Based in Indonesia, studying at ITS.</text>
    <text class="ui" y="76" fill="#f3ead8" font-size="17">I like turning messy ideas into systems that work.</text>
    <text class="ui" y="106" fill="#9ebbb2" font-size="15">Usually somewhere between a model, an API,</text>
    <text class="ui" y="132" fill="#9ebbb2" font-size="15">a data pipeline, and one more browser tab.</text>
    <path d="M0 156H455" stroke="#285247" />
    <text class="mono" y="178" fill="#8bf0b5" font-size="9" letter-spacing="1">INDONESIA / ITS / BUILDING USEFUL SYSTEMS</text>
  </g>
  <g transform="translate(600 31)">
    <path d="M126 91L36 30M126 91L216 28M126 91L225 159M126 91L30 164" fill="none" stroke="#2f6758" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" values="0;-24" dur="2.2s" repeatCount="indefinite" /></path>
    <circle cx="126" cy="91" r="40" fill="#102d25" stroke="#8bf0b5" />
    <text class="mono" x="126" y="88" fill="#8bf0b5" font-size="9" text-anchor="middle">INTERESTS</text><text class="mono" x="126" y="102" fill="#f3ead8" font-size="8" text-anchor="middle">CONNECTED</text>
    <g fill="#102d25" stroke="#2f6758"><circle cx="36" cy="30" r="25" /><circle cx="216" cy="28" r="25" /><circle cx="225" cy="159" r="25" /><circle cx="30" cy="164" r="25" /></g>
    <g class="mono" fill="#f3ead8" font-size="7" text-anchor="middle"><text x="36" y="28">MACHINE</text><text x="36" y="38">LEARNING</text><text x="216" y="26">GENERATIVE</text><text x="216" y="36">AI / LLM</text><text x="225" y="157">DATA</text><text x="225" y="167">SCIENCE</text><text x="30" y="162">DATA</text><text x="30" y="172">ENGINEERING</text></g>
    <circle cx="126" cy="91" r="46" fill="none" stroke="#ef7c65"><animate attributeName="r" values="40;54;40" dur="3s" repeatCount="indefinite" /><animate attributeName="opacity" values=".7;0;.7" dur="3s" repeatCount="indefinite" /></circle>
    <circle r="4" fill="#f1b85b"><animateMotion path="M36 30L126 91L216 28L126 91L225 159L126 91L30 164L126 91" dur="7s" repeatCount="indefinite" /></circle>
  </g>
</svg>
