<!-- Engineering Focus Matrix: 3 Core Technical Pillars -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290" role="img" aria-labelledby="title description">
  <title id="title">Engineering Focus &amp; Domains</title>
  <desc id="description">Core engineering pillars: AI and Agent Systems, Data and Stream Pipelines, and High-Throughput Backends.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#285247" stroke-opacity=".24" />
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "Courier New", monospace; }
      .ui { font-family: "Trebuchet MS", sans-serif; }
      .card-title { font-family: Georgia, "Times New Roman", serif; font-size: 17px; font-style: italic; }
      .card-sub { font-family: "Courier New", monospace; font-size: 9.5px; letter-spacing: 0.5px; }
      .card-tech { font-family: "Courier New", monospace; font-size: 8.5px; }
    </style>
  </defs>

  <rect width="900" height="290" rx="14" fill="#071b17" />
  <rect width="900" height="290" rx="14" fill="url(#grid)" />

  <!-- Section Header -->
  <g transform="translate(38 34)">
    <text class="mono" fill="#8bf0b5" font-size="10" letter-spacing="1.2">SYSTEMS &amp; DOMAIN SPECIALIZATION</text>
    <text class="title" y="32" fill="#f3ead8" font-size="26" font-style="italic">core engineering pillars</text>
  </g>
  <text class="mono" x="862" y="44" fill="#79a395" font-size="9" text-anchor="end">PRODUCTION ARCHITECTURES</text>
  <path d="M38 78H862" stroke="#285247" stroke-width="1" />

  <!-- Pillar 1: AI & Agent Systems -->
  <g transform="translate(38 96)">
    <rect width="260" height="162" rx="10" fill="#102d25" stroke="#2f6758" stroke-width="1.2" />
    <circle cx="32" cy="30" r="16" fill="#071b17" stroke="#ef7c65" stroke-width="1.5" />
    <!-- Brain / Agent Node Icon -->
    <circle cx="32" cy="30" r="4" fill="#ef7c65" />
    <path d="M24 30h16 M32 22v16 M26 24l12 12 M26 36l12-12" stroke="#ef7c65" stroke-width="1" stroke-opacity=".7" />
    
    <text class="card-title" x="58" y="34" fill="#f3ead8">AI &amp; Agent Systems</text>
    <path d="M16 54H244" stroke="#285247" />
    
    <text class="card-sub" x="16" y="74" fill="#ef7c65">HARNESSES &amp; LLM PIPELINES</text>
    <text class="ui" x="16" y="94" fill="#9ebbb2" font-size="11.5">Agent runtimes, tool execution,</text>
    <text class="ui" x="16" y="110" fill="#9ebbb2" font-size="11.5">RAG systems &amp; model evaluation.</text>
    
    <rect x="16" y="126" width="228" height="22" rx="4" fill="#071b17" stroke="#285247" />
    <text class="card-tech" x="24" y="140" fill="#8bf0b5">PyTorch · Ollama · LangChain · vLLM</text>
  </g>

  <!-- Pillar 2: Data & Stream Pipelines -->
  <g transform="translate(320 96)">
    <rect width="260" height="162" rx="10" fill="#102d25" stroke="#2f6758" stroke-width="1.2" />
    <circle cx="32" cy="30" r="16" fill="#071b17" stroke="#f1b85b" stroke-width="1.5" />
    <!-- Database / Pipeline Cylinder Icon -->
    <ellipse cx="32" cy="24" rx="8" ry="3.5" fill="none" stroke="#f1b85b" stroke-width="1.5" />
    <path d="M24 24v11c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5V24" fill="none" stroke="#f1b85b" stroke-width="1.5" />
    <path d="M24 30c0 2 3.6 3.5 8 3.5s8-1.5 8-3.5" fill="none" stroke="#f1b85b" stroke-width="1.2" stroke-dasharray="2 2" />

    <text class="card-title" x="58" y="34" fill="#f3ead8">Data &amp; Streams</text>
    <path d="M16 54H244" stroke="#285247" />

    <text class="card-sub" x="16" y="74" fill="#f1b85b">DISTRIBUTED ANALYTICS &amp; ETL</text>
    <text class="ui" x="16" y="94" fill="#9ebbb2" font-size="11.5">Stream ingestion, lakehouse storage,</text>
    <text class="ui" x="16" y="110" fill="#9ebbb2" font-size="11.5">and OLAP query engines.</text>

    <rect x="16" y="126" width="228" height="22" rx="4" fill="#071b17" stroke="#285247" />
    <text class="card-tech" x="24" y="140" fill="#f1b85b">Kafka · Spark · ClickHouse · Postgres</text>
  </g>

  <!-- Pillar 3: High-Throughput Backends -->
  <g transform="translate(602 96)">
    <rect width="260" height="162" rx="10" fill="#102d25" stroke="#2f6758" stroke-width="1.2" />
    <circle cx="32" cy="30" r="16" fill="#071b17" stroke="#8bf0b5" stroke-width="1.5" />
    <!-- Server / Network Grid Icon -->
    <rect x="25" y="23" width="14" height="6" rx="1.5" fill="none" stroke="#8bf0b5" stroke-width="1.2" />
    <rect x="25" y="31" width="14" height="6" rx="1.5" fill="none" stroke="#8bf0b5" stroke-width="1.2" />
    <circle cx="28" cy="26" r="1" fill="#8bf0b5" /><circle cx="28" cy="34" r="1" fill="#8bf0b5" />

    <text class="card-title" x="58" y="34" fill="#f3ead8">Backend Systems</text>
    <path d="M16 54H244" stroke="#285247" />

    <text class="card-sub" x="16" y="74" fill="#8bf0b5">MODULAR SERVICES &amp; QUEUES</text>
    <text class="ui" x="16" y="94" fill="#9ebbb2" font-size="11.5">Asynchronous task workers, caching,</text>
    <text class="ui" x="16" y="110" fill="#9ebbb2" font-size="11.5">and container orchestration.</text>

    <rect x="16" y="126" width="228" height="22" rx="4" fill="#071b17" stroke="#285247" />
    <text class="card-tech" x="24" y="140" fill="#8bf0b5">FastAPI · Redis · Celery · Docker · K8s</text>
  </g>
</svg>
