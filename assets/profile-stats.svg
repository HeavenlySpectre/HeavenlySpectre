<!-- Statistik publik sebagai simpul jaringan. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="190" viewBox="0 0 900 190" role="img" aria-labelledby="title description">
  <title id="title">GitHub lately</title>
  <desc id="description">Automatically updated public repository, follower, and indexed public commit statistics.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#285247" stroke-opacity=".24" /></pattern>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "Courier New", monospace; }
      .number { fill: #f3ead8; font: 36px Georgia, serif; }
      .label { fill: #79a395; font: 9px "Courier New", monospace; letter-spacing: 1px; }
    </style>
  </defs>
  <rect width="900" height="190" rx="14" fill="#071b17" /><rect width="900" height="190" rx="14" fill="url(#grid)" />
  <text class="title" x="34" y="42" fill="#f3ead8" font-size="22" font-style="italic">github lately</text>
  <text class="mono" id="stats-updated" x="842" y="40" fill="#79a395" font-size="9" text-anchor="end">UPDATED 13 AUG 2026</text>
  <path d="M165 35H710" stroke="#285247" />
  <circle cx="858" cy="36" r="5" fill="#ef7c65"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite" /></circle>
  <path d="M166 112C235 74 291 150 356 112S477 74 544 112S666 150 734 112" fill="none" stroke="#2f6758" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" values="0;-28" dur="2.5s" repeatCount="indefinite" /></path>
  <g transform="translate(72 76)">
    <circle cx="52" cy="36" r="42" fill="#102d25" stroke="#2f6758" />
    <path d="M31 20H44L49 25H68V45H31Z" fill="none" stroke="#8bf0b5" stroke-width="2" />
    <text class="number" id="stat-repos" x="92" y="42">25</text><text class="label" x="92" y="62">PUBLIC REPOSITORIES</text>
  </g>
  <g transform="translate(350 76)">
    <circle cx="52" cy="36" r="42" fill="#102d25" stroke="#2f6758" />
    <circle cx="52" cy="27" r="9" fill="none" stroke="#ef7c65" stroke-width="2" /><path d="M37 50C39 38 65 38 67 50" fill="none" stroke="#ef7c65" stroke-width="2" />
    <text class="number" id="stat-followers" x="92" y="42">04</text><text class="label" x="92" y="62">FOLLOWERS</text>
  </g>
  <g transform="translate(628 76)">
    <circle cx="52" cy="36" r="42" fill="#102d25" stroke="#2f6758" />
    <path d="M34 25H64M34 35H58M34 45H67" stroke="#f1b85b" stroke-width="2" stroke-linecap="round" />
    <text class="number" id="stat-commits" x="92" y="42">301</text><text class="label" x="92" y="62">INDEXED PUBLIC COMMITS</text>
  </g>
  <circle r="4" fill="#8bf0b5"><animateMotion path="M166 112C235 74 291 150 356 112S477 74 544 112S666 150 734 112" dur="4.8s" repeatCount="indefinite" /></circle>
</svg>
