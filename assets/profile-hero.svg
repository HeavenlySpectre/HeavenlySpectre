<!-- Sapaan profil dengan maskot Spectre. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm Kevin</title>
  <desc id="description">A playful developer desktop introducing Kevin Anugerah Faza and the things he builds.</desc>
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f7f1df" opacity="0.08" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.32" />
    </filter>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "Courier New", monospace; }
      .ui { font-family: "Trebuchet MS", sans-serif; }
    </style>
  </defs>

  <rect width="900" height="410" rx="14" fill="#0b1020" />
  <rect width="900" height="410" rx="14" fill="url(#dots)" />
  <rect x="24" y="22" width="852" height="366" rx="12" fill="#10182b" stroke="#2b3855" filter="url(#shadow)" />
  <path d="M24 68H876" stroke="#2b3855" />
  <circle cx="49" cy="45" r="6" fill="#ff6b5b" />
  <circle cx="69" cy="45" r="6" fill="#ffd166" />
  <circle cx="89" cy="45" r="6" fill="#b8ff65" />
  <text class="mono" x="450" y="50" fill="#8492ad" font-size="11" text-anchor="middle">github.com/HeavenlySpectre</text>

  <g transform="translate(66 111)">
    <rect width="128" height="27" rx="13.5" fill="#b8ff65" />
    <text class="mono" x="64" y="18" fill="#0b1020" font-size="11" font-weight="700" text-anchor="middle">HELLO, WORLD</text>
    <text class="title" x="0" y="91" fill="#f7f1df" font-size="60" font-weight="700">hi, i'm kevin.</text>
    <text class="ui" x="0" y="137" fill="#b4c3de" font-size="21">I build AI tools, data pipelines,</text>
    <text class="ui" x="0" y="168" fill="#b4c3de" font-size="21">and useful things for the web.</text>
    <path d="M0 194C69 184 140 207 216 194S356 188 432 196" fill="none" stroke="#ff6b5b" stroke-width="4" stroke-linecap="round" />
    <text class="mono" x="0" y="231" fill="#61d4ff" font-size="12">currently:</text>
    <text class="mono" x="78" y="231" fill="#f7f1df" font-size="12">learning / shipping / refactoring</text>
  </g>

  <g transform="translate(646 104)">
    <ellipse cx="92" cy="228" rx="92" ry="19" fill="#050814" opacity="0.55" />
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.8s" repeatCount="indefinite" />
      <path d="M25 105C25 55 54 21 94 21C134 21 163 55 163 105V208L139 190L116 211L93 190L70 211L48 190L25 208Z" fill="#f7f1df" />
      <path d="M44 105C44 67 64 43 94 43C124 43 144 67 144 105V169C129 158 112 153 94 153C76 153 59 158 44 169Z" fill="#e9dfc6" />
      <rect x="62" y="91" width="19" height="24" rx="7" fill="#0b1020" />
      <rect x="108" y="91" width="19" height="24" rx="7" fill="#0b1020" />
      <circle cx="69" cy="98" r="4" fill="#61d4ff" />
      <circle cx="115" cy="98" r="4" fill="#61d4ff" />
      <path d="M80 132Q94 141 108 132" fill="none" stroke="#0b1020" stroke-width="4" stroke-linecap="round" />
      <path d="M7 57L16 57M11.5 52.5V61.5M173 43L186 43M179.5 36.5V49.5" stroke="#b8ff65" stroke-width="3" stroke-linecap="round" />
      <circle cx="177" cy="151" r="5" fill="#ff6b5b" />
    </g>
    <rect x="36" y="246" width="118" height="26" rx="13" fill="#1b2740" stroke="#2b3855" />
    <text class="mono" x="95" y="263" fill="#b8ff65" font-size="10" text-anchor="middle">HEAVENLY SPECTRE</text>
  </g>

  <rect x="492" y="321" width="9" height="19" fill="#b8ff65">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
</svg>
