<!-- Sapaan profil dengan jaringan keahlian hidup. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm Kevin</title>
  <desc id="description">Kevin builds AI tools, data pipelines, and useful things for the web.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#285247" stroke-opacity=".28" />
    </pattern>
    <radialGradient id="halo">
      <stop stop-color="#8bf0b5" stop-opacity=".2" />
      <stop offset="1" stop-color="#8bf0b5" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "Courier New", monospace; }
      .ui { font-family: "Trebuchet MS", sans-serif; }
    </style>
  </defs>

  <rect width="900" height="390" rx="14" fill="#071b17" />
  <rect width="900" height="390" rx="14" fill="url(#grid)" />
  <path d="M34 54H866" stroke="#285247" />
  <text class="mono" x="34" y="35" fill="#8bf0b5" font-size="10" letter-spacing="1.2">GITHUB.COM/HEAVENLYSPECTRE</text>
  <text class="mono" x="866" y="35" fill="#79a395" font-size="9" text-anchor="end">INDONESIA / BUILDING</text>

  <g transform="translate(52 98)">
    <text class="mono" fill="#8bf0b5" font-size="11" letter-spacing="1.5">HELLO, WORLD</text>
    <text class="title" y="79" fill="#f3ead8" font-size="62">hi, i&#8217;m kevin.</text>
    <text class="ui" y="124" fill="#9ebbb2" font-size="20">I build AI tools, data pipelines,</text>
    <text class="ui" y="154" fill="#9ebbb2" font-size="20">and useful things for the web.</text>
    <path d="M0 180C77 166 139 196 223 178S359 169 438 184" fill="none" stroke="#ef7c65" stroke-width="3" stroke-linecap="round" stroke-dasharray="520" stroke-dashoffset="520">
      <animate attributeName="stroke-dashoffset" values="520;0;0" keyTimes="0;.45;1" dur="4.8s" repeatCount="indefinite" />
    </path>
    <text class="mono" y="222" fill="#8bf0b5" font-size="11">currently:</text>
    <text class="mono" x="75" y="222" fill="#f3ead8" font-size="11">learning / shipping / refactoring</text>
  </g>

  <g transform="translate(620 76)">
    <circle cx="120" cy="120" r="112" fill="url(#halo)" />
    <g fill="none" stroke="#2f6758" stroke-width="1.5" stroke-dasharray="5 8">
      <path d="M120 120L28 47M120 120L201 34M120 120L226 137M120 120L178 230M120 120L29 218">
        <animate attributeName="stroke-dashoffset" values="0;-26" dur="2.4s" repeatCount="indefinite" />
      </path>
    </g>
    <g fill="#102d25" stroke="#8bf0b5">
      <circle cx="28" cy="47" r="8" /><circle cx="201" cy="34" r="8" /><circle cx="226" cy="137" r="8" /><circle cx="178" cy="230" r="8" /><circle cx="29" cy="218" r="8" />
    </g>
    <g class="mono" fill="#79a395" font-size="8">
      <text x="5" y="31">CODE</text><text x="191" y="17">APPS</text><text x="233" y="140">DATA</text><text x="170" y="252">AI</text><text x="0" y="239">OPS</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -9;0 0" dur="3.8s" repeatCount="indefinite" />
      <path d="M75 102C75 62 93 39 120 39S165 62 165 102V178L150 166L135 180L120 166L105 180L90 166L75 178Z" fill="#f3ead8" />
      <circle cx="106" cy="101" r="6" fill="#071b17" />
      <circle cx="134" cy="101" r="6" fill="#071b17" />
      <circle cx="108" cy="99" r="2" fill="#8bf0b5" />
      <circle cx="136" cy="99" r="2" fill="#8bf0b5" />
      <path d="M108 125Q120 133 132 125" fill="none" stroke="#071b17" stroke-width="3" stroke-linecap="round" />
    </g>
    <circle cx="120" cy="120" r="58" fill="none" stroke="#8bf0b5" opacity=".45">
      <animate attributeName="r" values="58;74;58" dur="3.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values=".45;0;.45" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <circle r="5" fill="#ef7c65" filter="url(#glow)">
      <animateMotion path="M28 47L120 120L201 34L120 120L226 137L120 120L178 230L120 120L29 218L120 120" dur="9s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
