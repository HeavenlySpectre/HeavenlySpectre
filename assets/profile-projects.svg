<!-- Proyek publik sebagai cabang keahlian aktif. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title description">
  <title id="title">Featured public projects</title>
  <desc id="description">19MJ AI Career Platform and Big Data Lakehouse.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#285247" stroke-opacity=".24" /></pattern>
    <style>
      .title{font-family:Georgia,"Times New Roman",serif}.mono{font-family:"Courier New",monospace}.ui{font-family:"Trebuchet MS",sans-serif}
      .card{fill:#102d25;stroke:#2f6758}.name{fill:#f3ead8;font:italic 27px Georgia,serif}.body{fill:#9ebbb2;font:13px "Trebuchet MS",sans-serif}.tech{fill:#f3ead8;font:700 9px "Courier New",monospace;letter-spacing:.5px}.meta{fill:#79a395;font:8px "Courier New",monospace;letter-spacing:.4px}
    </style>
  </defs>
  <rect width="900" height="350" rx="14" fill="#071b17" /><rect width="900" height="350" rx="14" fill="url(#grid)" />
  <text class="title" x="38" y="46" fill="#f3ead8" font-size="27" font-style="italic">featured public builds</text>
  <text class="mono" x="862" y="43" fill="#8bf0b5" font-size="9" text-anchor="end">CLICK TO BROWSE MORE</text>
  <path d="M450 69V291M450 180H412M450 180H488" stroke="#2f6758" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" values="0;-24" dur="2.2s" repeatCount="indefinite" /></path>
  <circle cx="450" cy="180" r="9" fill="#102d25" stroke="#8bf0b5" /><circle cx="450" cy="180" r="14" fill="none" stroke="#8bf0b5"><animate attributeName="r" values="9;19;9" dur="2.8s" repeatCount="indefinite" /><animate attributeName="opacity" values=".7;0;.7" dur="2.8s" repeatCount="indefinite" /></circle>

  <g transform="translate(38 76)">
    <rect class="card" width="374" height="222" rx="12" /><rect width="374" height="5" rx="2.5" fill="#ef7c65" />
    <text class="mono" x="22" y="35" fill="#ef7c65" font-size="9" font-weight="700">AI PRODUCT / TEAM PROJECT</text>
    <text class="name" x="22" y="73">19MJ</text>
    <text class="body" x="22" y="105">AI career and hiring platform with CV analysis,</text><text class="body" x="22" y="128">fit scoring, ranking, interview transcription,</text><text class="body" x="22" y="151">and candidate summaries.</text>
    <path d="M22 169H352" stroke="#2f6758" /><text class="tech" x="22" y="190">REACT &#183; EXPRESS &#183; POSTGRESQL &#183; LLM / STT</text>
    <text class="meta" id="project-19mj-meta" x="22" y="209">JAVASCRIPT &#183; 1 STAR &#183; UPDATED 25 JUN 2026</text>
  </g>
  <g transform="translate(488 76)">
    <rect class="card" width="374" height="222" rx="12" /><rect width="374" height="5" rx="2.5" fill="#f1b85b" />
    <text class="mono" x="22" y="35" fill="#f1b85b" font-size="9" font-weight="700">DATA ENGINEERING / TEAM PROJECT</text>
    <text class="name" x="22" y="73">Big Data Lakehouse</text>
    <text class="body" x="22" y="105">Containerized lakehouse with streaming ingestion,</text><text class="body" x="22" y="128">medallion ETL, experiment tracking, automated</text><text class="body" x="22" y="151">training, and API-based model serving.</text>
    <path d="M22 169H352" stroke="#2f6758" /><text class="tech" x="22" y="190">KAFKA &#183; SPARK &#183; MINIO &#183; MLFLOW &#183; FASTAPI</text>
    <text class="meta" id="project-lakehouse-meta" x="22" y="209">JUPYTER NOTEBOOK &#183; 0 STARS &#183; UPDATED 27 JUN 2025</text>
  </g>
  <circle r="4" fill="#ef7c65"><animateMotion path="M412 180L450 180L488 180L450 180Z" dur="3s" repeatCount="indefinite" /></circle>
  <text class="mono" x="450" y="328" fill="#79a395" font-size="9" text-anchor="middle">PUBLIC REPOS FIRST &#183; NDA WORK STAYS PRIVATE</text>
</svg>
