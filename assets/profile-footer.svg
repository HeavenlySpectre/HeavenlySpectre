<!-- Penutup kontak sebagai simpul jaringan. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title description">
  <title id="title">Contact Kevin</title>
  <desc id="description">Feel free to contact Kevin, exchange ideas, and build something meaningful.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#285247" stroke-opacity=".24" /></pattern>
    <style>.title{font-family:Georgia,"Times New Roman",serif}.mono{font-family:"Courier New",monospace}.ui{font-family:"Trebuchet MS",sans-serif}</style>
  </defs>
  <rect width="900" height="220" rx="14" fill="#071b17" /><rect width="900" height="220" rx="14" fill="url(#grid)" />
  <g transform="translate(42 45)">
    <text class="mono" fill="#8bf0b5" font-size="10" letter-spacing="1.3">LET&#8217;S BUILD SOMETHING</text>
    <text class="title" y="57" fill="#f3ead8" font-size="39" font-style="italic">found something interesting?</text>
    <text class="ui" y="94" fill="#9ebbb2" font-size="15">Feel free to contact me, let&#8217;s exchange ideas and build something meaningful!</text>
  </g>
  <path d="M628 110L705 64M628 110L705 110M628 110L705 156" fill="none" stroke="#2f6758" stroke-width="2" stroke-dasharray="5 7"><animate attributeName="stroke-dashoffset" values="0;-24" dur="2.2s" repeatCount="indefinite" /></path>
  <circle cx="628" cy="110" r="29" fill="#102d25" stroke="#8bf0b5" /><text class="mono" x="628" y="108" fill="#8bf0b5" font-size="8" text-anchor="middle">CONTACT</text><text class="mono" x="628" y="121" fill="#f3ead8" font-size="7" text-anchor="middle">CONNECTED</text>
  <g fill="#102d25" stroke="#2f6758"><circle cx="705" cy="64" r="18" /><circle cx="705" cy="110" r="18" /><circle cx="705" cy="156" r="18" /></g>
  <g class="mono" font-size="9"><text x="738" y="68" fill="#8bf0b5">EMAIL</text><text x="738" y="114" fill="#75a8d7">LINKEDIN</text><text x="738" y="160" fill="#f1b85b">PROFILE VIEWS</text></g>
  <path d="M697 63h16M697 108h16M697 113h16" stroke="#f3ead8" stroke-width="1.5" />
  <circle cx="628" cy="110" r="36" fill="none" stroke="#ef7c65"><animate attributeName="r" values="29;42;29" dur="3s" repeatCount="indefinite" /><animate attributeName="opacity" values=".7;0;.7" dur="3s" repeatCount="indefinite" /></circle>
  <circle r="4" fill="#ef7c65"><animateMotion path="M628 110L705 64L628 110L705 110L628 110L705 156L628 110" dur="6s" repeatCount="indefinite" /></circle>
  <g transform="translate(817 66)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="3.6s" repeatCount="indefinite" /><path d="M0 27C0 10 11 0 27 0S54 10 54 27V65L45 58L36 67L27 58L18 67L9 58L0 65Z" fill="#f3ead8" /><circle cx="18" cy="27" r="4" fill="#071b17" /><circle cx="36" cy="27" r="4" fill="#071b17" /><path d="M20 42Q27 47 34 42" fill="none" stroke="#071b17" stroke-width="2" /></g></g>
  <text class="mono" x="858" y="201" fill="#79a395" font-size="8" text-anchor="end">@HEAVENLYSPECTRE</text>
</svg>
