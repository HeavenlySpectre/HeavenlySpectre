<!-- Sinyal aktivitas mingguan; diperbarui otomatis. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title description">
  <title id="title">GitHub activity signal</title>
  <desc id="description">115 contributions in the last year, represented as an animated weekly signal.</desc>
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2b3855" opacity="0.55" />
    </pattern>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#61d4ff" />
      <stop offset="1" stop-color="#b8ff65" />
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b8ff65" stop-opacity="0" />
      <stop offset="0.5" stop-color="#b8ff65" stop-opacity="0.7" />
      <stop offset="1" stop-color="#b8ff65" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <style>
      .title { font-family: Georgia, "Times New Roman", serif; }
      .mono { font-family: "Courier New", monospace; }
    </style>
  </defs>
  <rect width="900" height="320" rx="14" fill="#0b1020" />
  <rect width="900" height="320" rx="14" fill="url(#dots)" />
  <text class="title" x="38" y="48" fill="#f7f1df" font-size="27" font-style="italic">activity signal</text>
  <text class="mono" x="38" y="75" fill="#8492ad" font-size="10" letter-spacing="1">52 WEEKS / EACH BAR IS ONE WEEK</text>
  <text class="title" x="862" y="48" fill="#b8ff65" font-size="28" text-anchor="end">115</text>
  <text class="mono" x="862" y="69" fill="#8492ad" font-size="9" text-anchor="end">CONTRIBUTIONS IN THE LAST YEAR</text>
  <text class="mono" x="862" y="88" fill="#65718a" font-size="8" text-anchor="end">UPDATED 13 AUG 2026</text>
  <path d="M38 98H862" stroke="#2b3855" />
  <path d="M48 260H852" stroke="#2b3855" />

  <g fill="url(#bar)">
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze" />
    <rect x="52" y="247" width="10" height="13" rx="3"><animate attributeName="y" from="260" to="247" dur=".45s" begin="0s" fill="freeze"/><animate attributeName="height" from="0" to="13" dur=".45s" begin="0s" fill="freeze"/></rect>
    <rect x="67" y="260" width="10" height="0" rx="3" opacity=".25"/><rect x="82" y="251" width="10" height="9" rx="3"><animate attributeName="y" from="260" to="251" dur=".45s" begin=".07s" fill="freeze"/><animate attributeName="height" from="0" to="9" dur=".45s" begin=".07s" fill="freeze"/></rect>
    <rect x="97" y="239" width="10" height="21" rx="3"><animate attributeName="y" from="260" to="239" dur=".45s" begin=".11s" fill="freeze"/><animate attributeName="height" from="0" to="21" dur=".45s" begin=".11s" fill="freeze"/></rect>
    <rect x="112" y="248" width="10" height="12" rx="3"/><rect x="127" y="229" width="10" height="31" rx="3"/><rect x="142" y="244" width="10" height="16" rx="3"/><rect x="157" y="255" width="10" height="5" rx="3"/>
    <rect x="172" y="217" width="10" height="43" rx="3"/><rect x="187" y="252" width="10" height="8" rx="3"/><rect x="202" y="260" width="10" height="0" rx="3" opacity=".25"/><rect x="217" y="247" width="10" height="13" rx="3"/>
    <rect x="232" y="254" width="10" height="6" rx="3"/><rect x="247" y="235" width="10" height="25" rx="3"/><rect x="262" y="248" width="10" height="12" rx="3"/><rect x="277" y="260" width="10" height="0" rx="3" opacity=".25"/>
    <rect x="292" y="246" width="10" height="14" rx="3"/><rect x="307" y="252" width="10" height="8" rx="3"/><rect x="322" y="231" width="10" height="29" rx="3"/><rect x="337" y="221" width="10" height="39" rx="3"/>
    <rect x="352" y="230" width="10" height="30" rx="3"/><rect x="367" y="237" width="10" height="23" rx="3"/><rect x="382" y="250" width="10" height="10" rx="3"/><rect x="397" y="260" width="10" height="0" rx="3" opacity=".25"/>
    <rect x="412" y="234" width="10" height="26" rx="3"/><rect x="427" y="244" width="10" height="16" rx="3"/><rect x="442" y="214" width="10" height="46" rx="3"/><rect x="457" y="255" width="10" height="5" rx="3"/>
    <rect x="472" y="260" width="10" height="0" rx="3" opacity=".25"/><rect x="487" y="249" width="10" height="11" rx="3"/><rect x="502" y="253" width="10" height="7" rx="3"/><rect x="517" y="241" width="10" height="19" rx="3"/>
    <rect x="532" y="226" width="10" height="34" rx="3"/><rect x="547" y="244" width="10" height="16" rx="3"/><rect x="562" y="237" width="10" height="23" rx="3"/><rect x="577" y="250" width="10" height="10" rx="3"/>
    <rect x="592" y="218" width="10" height="42" rx="3"/><rect x="607" y="231" width="10" height="29" rx="3"/><rect x="622" y="246" width="10" height="14" rx="3"/><rect x="637" y="255" width="10" height="5" rx="3"/>
    <rect x="652" y="239" width="10" height="21" rx="3"/><rect x="667" y="226" width="10" height="34" rx="3"/><rect x="682" y="246" width="10" height="14" rx="3"/><rect x="697" y="233" width="10" height="27" rx="3"/>
    <rect x="712" y="248" width="10" height="12" rx="3"/><rect x="727" y="213" width="10" height="47" rx="3"/><rect x="742" y="229" width="10" height="31" rx="3"/><rect x="757" y="250" width="10" height="10" rx="3"/>
    <rect x="772" y="222" width="10" height="38" rx="3"/><rect x="787" y="242" width="10" height="18" rx="3"/><rect x="802" y="235" width="10" height="25" rx="3"/><rect x="817" y="247" width="10" height="13" rx="3"/>
  </g>
  <polyline points="57,247 72,260 87,251 102,239 117,248 132,229 147,244 162,255 177,217 192,252 207,260 222,247 237,254 252,235 267,248 282,260 297,246 312,252 327,231 342,221 357,230 372,237 387,250 402,260 417,234 432,244 447,214 462,255 477,260 492,249 507,253 522,241 537,226 552,244 567,237 582,250 597,218 612,231 627,246 642,255 657,239 672,226 687,246 702,233 717,248 732,213 747,229 762,250 777,222 792,242 807,235 822,247" fill="none" stroke="#61d4ff" stroke-opacity=".28" stroke-width="1.5" />
  <rect x="20" y="105" width="90" height="150" fill="url(#scan)" opacity=".32" filter="url(#glow)">
    <animate attributeName="x" values="-100;910" dur="7s" repeatCount="indefinite" />
  </rect>
  <circle cx="822" cy="247" r="4" fill="#b8ff65" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <text class="mono" x="48" y="291" fill="#65718a" font-size="9">OLDER</text>
  <text class="mono" x="852" y="291" fill="#65718a" font-size="9" text-anchor="end">NOW</text>
</svg>
