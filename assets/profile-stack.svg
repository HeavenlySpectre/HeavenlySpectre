<!-- Pengantar logo teknologi sebagai pohon keahlian. -->
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title description">
  <title id="title">Tools I build with</title>
  <desc id="description">A compact introduction to the complete logo-based technology stack below.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#285247" stroke-opacity=".24" /></pattern>
    <style>.title{font-family:Georgia,"Times New Roman",serif}.mono{font-family:"Courier New",monospace}.ui{font-family:"Trebuchet MS",sans-serif}</style>
  </defs>
  <rect width="900" height="150" rx="14" fill="#071b17" /><rect width="900" height="150" rx="14" fill="url(#grid)" />
  <text class="title" x="38" y="48" fill="#f3ead8" font-size="29" font-style="italic">tools i build with</text>
  <text class="ui" x="38" y="78" fill="#9ebbb2" font-size="13">The complete logo stack below, grouped by where each tool helps me build.</text>
  <g transform="translate(578 27)">
    <path d="M132 48L22 11M132 48L77 91M132 48L132 5M132 48L187 91M132 48L242 11" fill="none" stroke="#2f6758" stroke-width="2" stroke-dasharray="4 6"><animate attributeName="stroke-dashoffset" values="0;-20" dur="2s" repeatCount="indefinite" /></path>
    <circle cx="132" cy="48" r="23" fill="#102d25" stroke="#8bf0b5" /><text class="mono" x="132" y="51" fill="#f3ead8" font-size="8" text-anchor="middle">STACK</text>
    <g fill="#102d25" stroke-width="2"><circle cx="22" cy="11" r="11" stroke="#8bf0b5" /><circle cx="77" cy="91" r="11" stroke="#ef7c65" /><circle cx="132" cy="5" r="11" stroke="#75a8d7" /><circle cx="187" cy="91" r="11" stroke="#f1b85b" /><circle cx="242" cy="11" r="11" stroke="#f3ead8" /></g>
    <g class="mono" font-size="8" text-anchor="middle"><text x="22" y="33" fill="#8bf0b5">CODE</text><text x="77" y="115" fill="#ef7c65">APPS</text><text x="132" y="-12" fill="#75a8d7">DATA</text><text x="187" y="115" fill="#f1b85b">AI</text><text x="242" y="33" fill="#f3ead8">OPS</text></g>
    <circle cx="132" cy="48" r="29" fill="none" stroke="#8bf0b5"><animate attributeName="r" values="23;34;23" dur="2.8s" repeatCount="indefinite" /><animate attributeName="opacity" values=".6;0;.6" dur="2.8s" repeatCount="indefinite" /></circle>
  </g>
  <path d="M38 128H862" stroke="#285247" />
  <circle cy="128" r="4" fill="#ef7c65"><animate attributeName="cx" values="38;862" dur="5s" repeatCount="indefinite" /></circle>
</svg>
