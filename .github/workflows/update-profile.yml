name: Update profile data

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: update-profile-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh public telemetry data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Commit changed assets
        run: |
          if git diff --quiet -- assets/profile-stats.svg assets/profile-contributions.svg; then
            echo "Profile assets are current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-stats.svg assets/profile-contributions.svg
          git commit -m "chore: update telemetry data [skip ci]"
          git push
